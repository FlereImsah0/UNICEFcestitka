<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#009FE3">
  <title>UNICEF Božićna potvrda o donaciji</title>
  <link rel="icon" href="assets/unicef-emblem.svg" type="image/svg+xml" sizes="any">
  <link rel="stylesheet" href="style.css">
  <script src="gate.js" defer></script>
</head>
<body class="locked">
  <main id="root">
    <section class="gate" aria-labelledby="gate-title">
      <img class="gate-logo" src="assets/unicef-hr.png" alt="UNICEF – za svako dijete" width="1203" height="150">
      <div class="gate-card">
        <div class="gate-lock" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/>
          </svg>
        </div>
        <h1 id="gate-title">UNICEF Božićna potvrda o donaciji</h1>
        <form id="gate-form">
          <label for="access-code">Pristupni kod</label>
          <input id="access-code" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="Unesite kod" aria-describedby="gate-error" required>
          <button type="submit">Pristupi</button>
          <p id="gate-error" role="alert" hidden></p>
        </form>
        <noscript>Za pristup je potrebno omogućiti JavaScript u pregledniku.</noscript>
      </div>
    </section>
  </main>
</body>
</html>
